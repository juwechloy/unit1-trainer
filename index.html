:root{
  color-scheme:dark;
  --bg:#15121f; --card:#211d33; --raise:#2b2642; --ink:#fdf6ea; --muted:#bbb4cf; --line:#3d3758;
  --accent:#ff4fa3; --accent-ink:#1a1325; --soft:#33294d; --sun:#ffc531; --teal:#2fe0c5; --orange:#ff8a3c;
  --good:#4fe090; --good-soft:#173a2a; --bad:#ff7a6e; --bad-soft:#44201f; --gold:#ffc531; --shadow:#07060c;
  --display:"Anton","Impact","Haettenschweiler","Arial Narrow Bold",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:3px solid var(--shadow)}
.bar .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand b{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.03em;text-transform:uppercase;color:var(--sun)}
.brand span{color:var(--muted);font-size:14px;white-space:nowrap}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:2px 4px 4px}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--ink);padding:6px 13px;border-radius:8px;border:2px solid var(--line);font-size:15px;font-weight:700}
nav a[aria-current="page"]{background:var(--accent);border-color:var(--shadow);color:var(--accent-ink);box-shadow:2px 2px 0 var(--shadow)}
main{display:flex;flex-direction:column;gap:20px;padding-block:22px 60px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance;margin:0}
h1{font-size:38px;line-height:1.05;text-shadow:3px 3px 0 var(--shadow)}
h2{font-size:25px;line-height:1.15;color:var(--sun)}
h3{font-size:19px;line-height:1.2}
p{margin:0}
.lead{color:var(--muted);max-width:60ch}
.hero{position:relative;overflow:hidden;border:3px solid var(--shadow);border-radius:14px;box-shadow:6px 6px 0 var(--shadow);background:linear-gradient(180deg,#34206d 0%,#a92d86 48%,#ff6f4a 82%,#ffb347 100%);padding:22px 20px 92px;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(38px,9vw,60px);max-width:12ch}
.hero p{max-width:34ch;font-weight:700;text-shadow:1px 1px 0 var(--shadow)}
.hero svg{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:96px;display:block}

function englishVoice(){let vs=[];try{vs=speechSynthesis.getVoices()||[]}catch(e){}const lang=v=>String(v.lang||'').toLowerCase().replace('_','-');
  return vs.find(v=>lang(v)==='en-gb')||vs.find(v=>lang(v)==='en-us')||vs.find(v=>lang(v).startsWith('en'))||null}

  if(!('speechSynthesis' in window)){toast('Vorlesen funktioniert in diesem Browser leider nicht.');return}
  await voicesReady();const v=englishVoice();

  const lines=typeof what==='string'?[{text:what}]:what;
  if(TTS&&!ttsBlocked&&voicePref!=='device'){
    try{if(!ttsLang){ttsLang='en';try{const ls=await TTS.languages();ttsLang=ls.find(x=>/^en-gb$/i.test(x))||ls.find(x=>/^en$/i.test(x))||ls.find(x=>/^en/i.test(x))||''}catch(e){}}
      if(!ttsLang)throw{code:'unavailable'};
      await TTS.speak(lines.map(said).join(' ').slice(0,1950),{voice:'rounded',rate:rate||.9,language:ttsLang});return}
    catch(e){const c=e&&e.code,r=e&&e.reason;if(c==='stopped'||r==='replaced'||r==='viewer_stopped'||r==='stopped')return;
